apply plugin: "java"

sourceCompatibility = 1.8
targetCompatibility = 1.8

sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = [ "../assets/" ]

eclipse.project {
  name = appName + "-lwjgl3"
}

// The run task for LWJGL3 with increased memory settings
task run(dependsOn: classes, type: JavaExec) {
  mainClass = "io.github.noahcraft.lwjgl3.Lwjgl3Launcher"
  classpath = sourceSets.main.runtimeClasspath
  standardInput = System.in
  workingDir = project.assetsDir
  ignoreExitValue = true

  // Increase heap space - you can adjust these values as needed
  jvmArgs = ["-Xms512m", "-Xmx2g", "-XX:+UseG1GC"]
}

// The debug task for LWJGL3 with increased memory settings
task debug(dependsOn: classes, type: JavaExec) {
  mainClass = "io.github.noahcraft.lwjgl3.Lwjgl3Launcher"
  classpath = sourceSets.main.runtimeClasspath
  standardInput = System.in
  workingDir = project.assetsDir
  ignoreExitValue = true
  debug = true

  // Increase heap space - you can adjust these values as needed
  jvmArgs = ["-Xms512m", "-Xmx2g", "-XX:+UseG1GC", "-XX:+HeapDumpOnOutOfMemoryError"]
}

// Package task that creates a JAR with all dependencies included
task dist(type: Jar) {
  from files(sourceSets.main.output.classesDirs)
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  from files(project.assetsDir)

  manifest {
    attributes 'Main-Class': 'io.github.noahcraft.lwjgl3.Lwjgl3Launcher'
  }
}
