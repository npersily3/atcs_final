buildscript {
  repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    gradlePluginPortal()
    google()
  }
  dependencies {
    // Note: Don't specify android plugin version here if you're not building for Android
  }
}

allprojects {
  apply plugin: "eclipse"
  apply plugin: "idea"

  version = '1.0'
  ext {
    appName = "NoahCraft"
    gdxVersion = '1.13.1'
    roboVMVersion = '2.3.23'
    box2DLightsVersion = '1.5'
    ashleyVersion = '1.7.4'
    aiVersion = '1.8.2'
    lwjglVersion = '3.3.3'

    // Define the assets directory here for all projects to use
    assetsDir = rootProject.file("assets")
  }

  repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    google()
  }
}

// Configure project for each platform
project(":core") {
  apply plugin: "java-library"

  dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    // Add any other core dependencies here
  }
}

project(":lwjgl3") {
  apply plugin: "java"

  dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  }
}

